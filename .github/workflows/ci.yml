name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete
